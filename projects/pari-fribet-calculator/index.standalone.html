<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор фрибета — БК Пари</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*,
*::before,
*::after { box-sizing: border-box; }
:root {
  --bg:#ffffff; --card-bg:#ffffff; --card-border:#e8e8e8; --footer-bg:#f2f2f2;
  --text:#111111; --text-muted:#8a8a8a; --accent:#00a082; --accent-dark:#007a63;
  --accent-light:#e6f7f3; --rank-bg:#f0f0f0; --arrow:#c8c8c8;
  --shadow:0 2px 16px rgba(0,0,0,.06); --radius-card:18px; --radius-sm:10px;
}
html { tab-size:4; text-size-adjust:100%; word-break:normal; }
body {
  margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px;
  line-height:1.45; color:var(--text); background:var(--bg); overflow-x:hidden;
}
.calculator { width:100%; max-width:960px; margin:0 auto; padding:20px; }
.flow { display:flex; align-items:stretch; justify-content:center; gap:0; width:100%; }
.flow__arrow { display:flex; align-items:center; justify-content:center; flex:0 0 28px; color:var(--arrow); font-size:24px; font-weight:300; line-height:1; user-select:none; }
.card {
  flex:1 1 0; min-width:180px; max-width:280px; border:1px solid var(--card-border);
  border-radius:var(--radius-card); background:var(--card-bg); box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.card__top { padding:14px 14px 0; flex-shrink:0; }
.card__step {
  width:28px; height:28px; border-radius:50%; background:var(--rank-bg); display:flex;
  align-items:center; justify-content:center; font-size:13px; font-weight:600; color:var(--text-muted);
}
.card__body { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 16px 16px; text-align:center; }
.card__icon {
  width:64px; height:64px; border-radius:50%; background:var(--accent-light); display:flex;
  align-items:center; justify-content:center; margin-bottom:12px; color:var(--accent-dark); flex-shrink:0;
}
.card__icon svg { width:30px; height:30px; }
.card__amount { margin:0 0 8px; font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.2; word-break:break-word; }
.card__amount.is-zero { color:var(--text-muted); }
.card__title { margin:0; font-size:14px; font-weight:600; line-height:1.35; }
.card__footer {
  display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 14px;
  background:var(--footer-bg); font-size:13px; font-weight:500;
  border-radius:0 0 calc(var(--radius-card) - 1px) calc(var(--radius-card) - 1px); flex-shrink:0;
}
.card__footer-icon {
  width:22px; height:22px; border-radius:50%; background:#fff; display:flex; align-items:center;
  justify-content:center; flex-shrink:0; font-size:12px;
}
.card--input .card__title { margin-bottom:14px; }
.card__controls { width:100%; display:flex; flex-direction:column; gap:14px; }
.card__field-wrap { position:relative; width:100%; }
.card__field {
  width:100%; padding:12px 36px; border:1.5px solid var(--card-border); border-radius:var(--radius-sm);
  font:inherit; font-size:20px; font-weight:600; color:var(--text); background:var(--card-bg);
  outline:none; text-align:center; transition:border-color .15s;
}
.card__field:focus { border-color:var(--accent); }
.card__currency {
  position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:16px;
  font-weight:500; color:var(--text-muted); pointer-events:none;
}
.card__slider {
  width:100%; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px;
  background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--slider-progress,15%),#e8e8e8 var(--slider-progress,15%),#e8e8e8 100%);
  outline:none; cursor:pointer;
}
.card__slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent);
  border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.18); cursor:pointer;
}
.card__slider::-moz-range-thumb {
  width:22px; height:22px; border-radius:50%; background:var(--accent);
  border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.18); cursor:pointer;
}
@media (max-width:560px){
  .calculator{padding:12px;}
  .flow{flex-direction:column; align-items:stretch; gap:0;}
  .flow__arrow{flex:none; height:24px; transform:rotate(90deg);}
  .card{flex:none; width:100%; max-width:none; min-width:0;}
}
  </style>
</head>
<body>
  <div class="calculator">
    <div class="flow" id="cards-flow" aria-live="polite"></div>
  </div>
  <script>
const BONUS_CONFIG = {
  minDeposit: 100,
  maxBonus: 20000,
  turnoverMultiplier: 15,
  defaultDeposit: 7500,
  sliderMax: 50000,
  sliderStep: 100,
  cards: [
    { step: 1, type: 'input', title: 'Введите депозит', footerText: 'Минимальный деп = 100₽' },
    { step: 2, title: 'Доступный фрибет', footerIcon: 'gift', footerText: 'Максимальный бонус = 20000₽' },
    { step: 3, title: 'Сумма ставок для вывода', footerIcon: 'target', footerText: '' },
  ],
};

(function () {
  const cfg = BONUS_CONFIG;
  const els = { field: null, slider: null, flow: document.getElementById('cards-flow') };
  const icons = {
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="11" rx="1"/><path d="M12 10v11"/><path d="M3 14h18"/><path d="M12 10c-2-3-5-3-5-1s2 2 5 1 5-3 5-1-3 2-5 1z"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>',
  };
  const footerEmoji = { gift: '🎁', target: '📊' };
  const formatMoney = (v) => new Intl.NumberFormat('ru-RU').format(Math.round(v)) + ' ₽';

  function calculate(deposit) {
    const amount = Math.max(0, Number(deposit) || 0);
    if (amount < cfg.minDeposit) return { deposit: amount, bonus: 0, turnover: 0 };
    const bonus = Math.min(amount, cfg.maxBonus);
    return { deposit: amount, bonus, turnover: bonus * cfg.turnoverMultiplier };
  }
  function amountValue(cardIndex, result) { return cardIndex === 1 ? formatMoney(result.bonus) : formatMoney(result.turnover); }

  function buildInputCard(card) {
    return '<article class="card card--input" data-step="'+card.step+'"><div class="card__top"><span class="card__step">'+card.step+'</span></div><div class="card__body"><h3 class="card__title">'+card.title+'</h3><div class="card__controls"><div class="card__field-wrap"><input class="card__field" id="deposit-input" type="number" inputmode="numeric" min="0" step="100" autocomplete="off" aria-label="Сумма депозита" /><span class="card__currency" aria-hidden="true">₽</span></div><input class="card__slider" id="deposit-slider" type="range" aria-label="Сумма депозита" /></div></div><div class="card__footer"><span>'+card.footerText+'</span></div></article>';
  }
  function buildResultCard(card, index) {
    const hasFooter = Boolean(card.footerText);
    const footerHtml = hasFooter ? '<div class="card__footer">'+(card.footerIcon ? '<span class="card__footer-icon">'+(footerEmoji[card.footerIcon]||'')+'</span>' : '')+'<span>'+card.footerText+'</span></div>' : '';
    return '<article class="card" data-step="'+card.step+'"><div class="card__top"><span class="card__step">'+card.step+'</span></div><div class="card__body"><div class="card__icon">'+(icons[card.footerIcon]||'')+'</div><p class="card__amount" data-amount data-card-index="'+index+'">'+formatMoney(0)+'</p><h3 class="card__title">'+card.title+'</h3></div>'+footerHtml+'</article>';
  }
  function buildCards() {
    els.flow.innerHTML = '';
    cfg.cards.forEach((card, index) => {
      if (index > 0) {
        const arrow = document.createElement('div');
        arrow.className = 'flow__arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';
        els.flow.appendChild(arrow);
      }
      const wrapper = document.createElement('div');
      wrapper.innerHTML = card.type === 'input' ? buildInputCard(card) : buildResultCard(card, index);
      els.flow.appendChild(wrapper.firstElementChild);
    });
    els.field = document.getElementById('deposit-input');
    els.slider = document.getElementById('deposit-slider');
  }
  function updateSliderProgress(value) {
    const progress = Math.min(100, (value / cfg.sliderMax) * 100);
    els.slider.style.setProperty('--slider-progress', progress + '%');
  }
  function updateCards(result) {
    els.flow.querySelectorAll('[data-amount]').forEach((amount) => {
      const index = Number(amount.dataset.cardIndex);
      amount.textContent = amountValue(index, result);
      amount.classList.toggle('is-zero', result.bonus === 0);
    });
  }
  function render(deposit) {
    const clamped = Math.min(cfg.sliderMax, Math.max(0, deposit));
    const result = calculate(clamped);
    els.field.value = clamped === 0 ? '' : clamped;
    els.slider.value = clamped;
    updateSliderProgress(clamped);
    updateCards(result);
  }
  function bindEvents() {
    els.field.addEventListener('input', () => {
      const raw = els.field.value.replace(/\s/g, '').replace(',', '.');
      const value = raw === '' ? 0 : parseFloat(raw);
      render(Number.isFinite(value) ? value : 0);
    });
    els.slider.addEventListener('input', () => render(Number(els.slider.value)));
  }

  buildCards();
  els.slider.min = 0;
  els.slider.max = cfg.sliderMax;
  els.slider.step = cfg.sliderStep;
  bindEvents();
  render(cfg.defaultDeposit);
})();
  </script>
  <script>
let lastHeight = null;
const resize = ({ force = false }) => {
  const currentHeight = document.body.scrollHeight;
  if (lastHeight !== null && !force && Math.abs(currentHeight - lastHeight) < 2) return;
  lastHeight = currentHeight;
  const dataUTILS = {
    for: 'BASIC_TEST',
    action: 'resizeIframe',
    selector: 'iframe[src*="netlify.app"]',
    sizes: { height: 2 * Math.floor(currentHeight / 2) + 10 },
  };
  window?.top?.postMessage(JSON.stringify(dataUTILS), '*');
};
const resizeObserver = new ResizeObserver(() => resize({}));
resizeObserver.observe(document.body);
resize({ force: true });
setTimeout(() => resize({ force: true }), 1000);
setTimeout(() => resize({ force: true }), 2000);
setTimeout(() => resize({ force: true }), 3000);
setTimeout(() => resize({ force: true }), 5000);
setTimeout(() => resize({ force: true }), 7000);
  </script>
</body>
</html>
