<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор Букмекера - Опросник</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 20px;
  line-height: 1.6;
  max-width: 660px;
  margin: 0 auto;
}

.container {
  max-width: 800px;
  margin: 0 auto;
}

header {
  text-align: center;
  color: white;
  margin-bottom: 40px;
  padding: 20px;
}

header h1 {
  font-size: 2.5em;
  margin-bottom: 10px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

.subtitle {
  font-size: 1.1em;
  opacity: 0.95;
}

#quiz-container {
  background: white;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.progress-bar {
  width: 100%;
  height: 8px;
  background: #e0e0e0;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
  border-radius: 10px;
  transition: width 0.3s ease;
  width: 0%;
}

.question-counter {
  text-align: center;
  color: #666;
  font-size: 0.9em;
  margin-bottom: 30px;
  font-weight: 500;
}

.question-card {
  min-height: 300px;
}

.question-text {
  font-size: 1.8em;
  color: #333;
  margin-bottom: 30px;
  text-align: center;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.option-btn {
  padding: 18px 25px;
  font-size: 1.1em;
  border: 2px solid #e0e0e0;
  background: white;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: left;
  font-weight: 500;
  color: #333;
}

.option-btn:hover {
  border-color: #667eea;
  background: #f8f9ff;
  transform: translateX(5px);
}

.option-btn.selected {
  border-color: #667eea;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  transform: scale(1.02);
}

.navigation {
  display: flex;
  justify-content: space-between;
  margin-top: 40px;
  gap: 15px;
}

.btn {
  padding: 15px 35px;
  font-size: 1.1em;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
  flex: 1;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-secondary {
  background: #f0f0f0;
  color: #333;
}

.btn-secondary:hover {
  background: #e0e0e0;
  transform: translateY(-2px);
}

#result-container {
  background: white;
  border-radius: 20px;
  padding: 50px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-card h2 {
  text-align: center;
  font-size: 2.2em;
  color: #333;
  margin-bottom: 40px;
}

.winner {
  text-align: center;
  padding: 40px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 15px;
  color: white;
  margin-bottom: 40px;
}

.winner-logo {
  width: 200px;
  height: 120px;
  background: white;
  border-radius: 15px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.winner-logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.winner-name {
  font-size: 2em;
  margin-bottom: 15px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

.winner-description {
  font-size: 1.2em;
  opacity: 0.95;
}

.other-recommendations {
  margin-bottom: 30px;
}

.other-recommendations h3 {
  font-size: 1.5em;
  color: #333;
  margin-bottom: 20px;
  text-align: center;
}

.recommendations-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.recommendation-item {
  display: flex;
  align-items: center;
  padding: 20px;
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  transition: all 0.3s ease;
}

.recommendation-item:hover {
  border-color: #667eea;
  background: #f8f9ff;
  transform: translateX(5px);
}

.rec-logo {
  width: 100px;
  height: 60px;
  object-fit: contain;
  margin-right: 20px;
  padding: 10px;
  background: white;
  border-radius: 8px;
  border: 1px solid #e0e0e0;
}

.rec-info h4 {
  font-size: 1.3em;
  color: #333;
  margin-bottom: 5px;
}

.rec-info p {
  color: #666;
  font-size: 0.95em;
}

#restart-btn {
  width: 100%;
  margin-top: 30px;
}

@media (max-width: 768px) {
  body {
    padding: 10px;
  }
  
  header h1 {
    font-size: 1.8em;
  }
  
  .subtitle {
    font-size: 1em;
  }
  
  #quiz-container {
    padding: 25px;
  }
  
  #result-container {
    padding: 30px;
  }
  
  .question-text {
    font-size: 1.4em;
  }
  
  .option-btn {
    padding: 15px 20px;
    font-size: 1em;
  }
  
  .navigation {
    flex-direction: column;
  }
  
  .btn {
    width: 100%;
  }
  
  .winner-logo {
    width: 150px;
    height: 90px;
  }
  
  .winner-name {
    font-size: 1.5em;
  }
  
  .recommendation-item {
    flex-direction: column;
    text-align: center;
  }
  
  .rec-logo {
    margin-right: 0;
    margin-bottom: 15px;
  }
}
    </style>

// Вопросы опросника
const QUESTIONS = [
  {
    id: 1,
    text: 'Важна ли вам популярность букмекерской компании?',
    criteria: 'popularity',
    options: [
      { text: 'Да, хочу известного букмекера', weight: 10 },

  },

  },
  {

    text: 'Планируете делать ставки экспрессом?',
    criteria: 'expressBets',
    options: [
      { text: 'Да, в основном экспрессы', weight: 10 },
      { text: 'Часто делаю экспрессы', weight: 7 },

  },
  {

    text: 'Что для вас важнее при выборе?',

    options: [
      { text: 'Оценка редакции "Спортса"', weights: [10, 0] },
      { text: 'Скорее оценка редакции', weights: [8, 3] },
      { text: 'Одинаково важно', weights: [5, 5] },
      { text: 'Скорее мнение пользователей', weights: [3, 8] },

    ]

// Состояние опроса
let currentQuestion = 0;
let userAnswers = {};
let criteriaWeights = {};

// DOM элементы
const quizContainer = document.getElementById('quiz-container');
const resultContainer = document.getElementById('result-container');
const questionCard = document.getElementById('question-card');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const progress = document.getElementById('progress');
const currentQuestionSpan = document.getElementById('current-question');
const totalQuestionsSpan = document.getElementById('total-questions');

// Инициализация
function init() {
  totalQuestionsSpan.textContent = QUESTIONS.length;
  renderQuestion();
}

// Отображение вопроса
function renderQuestion() {
  const question = QUESTIONS[currentQuestion];
  currentQuestionSpan.textContent = currentQuestion + 1;
  
  let html = `
    <h2 class="question-text">${question.text}</h2>
    <div class="options">
  `;
  
  question.options.forEach((option, index) => {
    const isSelected = userAnswers[question.id] === index;
    html += `
      <button class="option-btn ${isSelected ? 'selected' : ''}" 
              onclick="selectOption(${index})">
        ${option.text}
      </button>
    `;
  });
  
  html += '</div>';
  questionCard.innerHTML = html;
  
  updateProgress();
  updateNavigation();
}

// Выбор опции
function selectOption(optionIndex) {
  userAnswers[QUESTIONS[currentQuestion].id] = optionIndex;
  
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, index) => {
    btn.classList.toggle('selected', index === optionIndex);
  });
  
  nextBtn.disabled = false;
}

// Обновление прогресс-бара
function updateProgress() {
  const progressPercent = ((currentQuestion + 1) / QUESTIONS.length) * 100;
  progress.style.width = progressPercent + '%';
}

// Обновление навигации
function updateNavigation() {
  prevBtn.style.display = currentQuestion > 0 ? 'block' : 'none';
  nextBtn.disabled = userAnswers[QUESTIONS[currentQuestion].id] === undefined;
  
  if (currentQuestion === QUESTIONS.length - 1) {
    nextBtn.textContent = 'Показать результат';
  } else {
    nextBtn.textContent = 'Далее →';
  }
}

// Следующий вопрос
function nextQuestion() {
  if (currentQuestion < QUESTIONS.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResults();
  }
}

// Предыдущий вопрос
function previousQuestion() {
  if (currentQuestion > 0) {
    currentQuestion--;
    renderQuestion();
  }
}

// Расчет результатов
function calculateResults() {
  const criteriaScores = {};
  
  QUESTIONS.forEach(question => {
    const answerIndex = userAnswers[question.id];
    const option = question.options[answerIndex];
    
    if (Array.isArray(question.criteria)) {
      question.criteria.forEach((criterion, idx) => {
        if (!criteriaScores[criterion]) criteriaScores[criterion] = 0;
        criteriaScores[criterion] += option.weights[idx];
      });
    } else {
      if (!criteriaScores[question.criteria]) criteriaScores[question.criteria] = 0;
      criteriaScores[question.criteria] += option.weight;
    }
  });
  
  const bookmakersScores = {};
  
  Object.keys(BOOKMAKERS_DATA).forEach(bookmakerKey => {
    const bookmaker = BOOKMAKERS_DATA[bookmakerKey];
    let totalScore = 0;
    
    Object.keys(criteriaScores).forEach(criterion => {
      const userWeight = criteriaScores[criterion];
      const bookmakerScore = bookmaker.scores[criterion];
      totalScore += userWeight * bookmakerScore;
    });
    
    bookmakersScores[bookmakerKey] = {
      ...bookmaker,
      totalScore: totalScore
    };
  });
  
  const sortedBookmakers = Object.entries(bookmakersScores)
    .sort((a, b) => b[1].totalScore - a[1].totalScore);
  
  return sortedBookmakers;
}

// Отображение результатов
function showResults() {
  const results = calculateResults();
  const topBookmaker = results[0][1];
  
  let html = `
    <div class="winner">
      <div class="winner-logo">
        <img src="${topBookmaker.logo}" alt="${topBookmaker.name}">
      </div>
      <h3 class="winner-name">${topBookmaker.name}</h3>
      <p class="winner-description">${topBookmaker.description}</p>
    </div>
    
    <div class="other-recommendations">
      <h3>Другие подходящие варианты:</h3>
      <div class="recommendations-list">
  `;
  
  for (let i = 1; i < Math.min(4, results.length); i++) {
    const bookmaker = results[i][1];
    html += `
      <div class="recommendation-item">
        <img src="${bookmaker.logo}" alt="${bookmaker.name}" class="rec-logo">
        <div class="rec-info">
          <h4>${bookmaker.name}</h4>
          <p>${bookmaker.description}</p>
        </div>
      </div>
    `;
  }
  
  html += `
      </div>
    </div>
  `;
  
  document.getElementById('result-content').innerHTML = html;
  
  quizContainer.style.display = 'none';
  resultContainer.style.display = 'block';
}

// Перезапуск опроса
function restartQuiz() {
  currentQuestion = 0;
  userAnswers = {};
  criteriaWeights = {};
  
  quizContainer.style.display = 'block';
  resultContainer.style.display = 'none';
  
  renderQuestion();
}

// Обработчики событий
nextBtn.addEventListener('click', nextQuestion);
prevBtn.addEventListener('click', previousQuestion);
document.getElementById('restart-btn').addEventListener('click', restartQuiz);

// Запуск приложения
init();
    </script>
    <script>
let lastHeight = null;
let resizeTimeout;

const resize = ({force = false}) => {
 const currentHeight = document.body.scrollHeight;
 
 if (lastHeight !== null && !force && Math.abs(currentHeight - lastHeight) < 2) {
 return;
 }
 
 lastHeight = currentHeight;
 
 const dataUTILS = {
 for: 'BASIC_TEST',
 action: 'resizeIframe',
 selector: `iframe[src*="netlify.app"]`,
 sizes: {
 height: 2 * Math.floor(currentHeight / 2) + 10,
 },
 };

 window?.top?.postMessage(JSON.stringify(dataUTILS), '*');
 }


const resizeObserver = new ResizeObserver(() => {
 resize({});
});
resizeObserver.observe(document.body);
resize({force: true});

setTimeout(() => {
 resize({force: true});
}, 1000);

setTimeout(() => {
