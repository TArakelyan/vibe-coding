  <meta charset="UTF-8" />

  <title>Эксперты букмекерской индустрии</title>
  <style>
@import "https://senoval.cdn.sports.ru/static-resources/fonts/roboto.css";

*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --text: #1a1a1a;
  --text-muted: #666;
  --border: #e0e0e0;
  --accent: #00c78b;
  --accent-hover: #21a67e;
  --accent-soft: rgba(0, 199, 139, 0.14);
  --bg: #fff;
  --row-hover: #fafafa;
  --maxw: 660px;
  --ui-font: "Neoris", "Roboto", sans-serif;
}

html {
  tab-size: 4;
  text-size-adjust: 100%;
  word-break: normal;
}

body {
  margin: 0;
  font-family: var(--ui-font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
}

.page {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 16px 16px 28px;
  container-type: inline-size;
  container-name: experts-page;
}

.table-wrap {
  margin-top: 0;
}

.rows {
  min-height: 40px;
}

.expert-row {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) minmax(0, 1.35fr);
  gap: 10px 14px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: background 0.15s ease;
}

.expert-row:hover {
  background: var(--row-hover);
}

.expert-row:hover .name-line--family {
  color: var(--accent);
}

.expert-row:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.expert-row > .cell {
  min-width: 0;
}

.cell--company-logo {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.company-logo-wrap {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #dcdcdc;
  overflow: hidden;
  background: #fff;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.company-logo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.cell--person {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.expert-photo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: #eee;
}

.name-lines {
  min-width: 0;
  flex: 1;
}

.name-line {
  display: block;
  font-size: 14px;
  line-height: 1.3;
}

.name-line--given {
  font-weight: 400;
  color: var(--text-muted);
}

.name-line--family {
  font-weight: 700;
  color: var(--text);
}

.name-lines--single .name-line--given {
  font-weight: 700;
  color: var(--text);
}

.cell--description {
  font-size: 13px;
  line-height: 1.4;
  color: var(--text);
  overflow-wrap: break-word;
  word-break: normal;
}

@container experts-page (max-width: 480px) {
  .expert-row {
    gap: 6px 8px;
    grid-template-columns: 38px minmax(0, 0.95fr) minmax(0, 1.05fr);
    padding: 10px 0;
  }

  .company-logo-wrap {
    width: 28px;
    height: 28px;
  }

  .expert-photo {
    width: 36px;
    height: 36px;
  }

  .cell--person {
    gap: 8px;
  }

  .name-line {
    font-size: 12px;
  }

  .cell--description {
    font-size: 11px;
  }
}

@media (max-width: 480px) {
  .page {
    padding: 12px 10px 24px;
  }

  .expert-row {
    gap: 6px 8px;
    grid-template-columns: 38px minmax(0, 0.95fr) minmax(0, 1.05fr);
    padding: 10px 0;
  }

  .company-logo-wrap {
    width: 28px;
    height: 28px;
  }

  .expert-photo {
    width: 36px;
    height: 36px;
  }

  .cell--person {
    gap: 8px;
  }

  .name-line {
    font-size: 12px;
  }

  .cell--description {
    font-size: 11px;
  }
}

.empty-state {
  padding: 28px 12px;
  text-align: center;
  font-size: 14px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

</style>

<script>
(function () {
  'use strict';

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function splitFullName(fullName) {
    const parts = String(fullName).trim().split(/\s+/);
    if (parts.length <= 1) {
      return { line1: parts[0] || '', line2: '' };
    }
    const last = parts.pop();
    return { line1: parts.join(' '), line2: last };
  }

  function companyLogoHtml(logoUrl) {
    if (!logoUrl) {
      return '<span class="cell cell--company-logo" aria-hidden="true"></span>';
    }
    return (
      '<span class="cell cell--company-logo">' +
      '<span class="company-logo-wrap">' +
      '<img class="company-logo" src="' +
      escapeHtml(logoUrl) +
      '" alt="" loading="lazy" />' +
      '</span></span>'
    );
  }

  function render() {
    const container = document.getElementById('rowsContainer');

    if (typeof EXPERTS === 'undefined' || !EXPERTS.length) {
      container.innerHTML = '<div class="empty-state">Не загружены данные.</div>';
      return;
    }

    container.innerHTML = EXPERTS.map(function (row) {
      const names = splitFullName(row.fullName);
      const nameLinesClass = 'name-lines' + (names.line2 ? '' : ' name-lines--single');

      return (
        '<a class="expert-row" href="' +
        escapeHtml(row.sportsUrl) +
        '" target="_blank" rel="noopener noreferrer">' +
        companyLogoHtml(row.companyLogo) +
        '<span class="cell cell--person">' +
        '<img class="expert-photo" src="' +
        escapeHtml(row.photoUrl) +
        '" alt="" width="44" height="44" loading="lazy" />' +
        '<span class="' +
        nameLinesClass +
        '">' +
        '<span class="name-line name-line--given">' +
        escapeHtml(names.line1) +
        '</span>' +
        (names.line2
          ? '<span class="name-line name-line--family">' + escapeHtml(names.line2) + '</span>'
          : '') +
        '</span></span>' +
        '<span class="cell cell--description">' +
        escapeHtml(row.description) +
        '</span>' +
        '</a>'
      );
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', render);
})();

</script>
<script>
let lastHeight = null; // null означает что это первый вызов
let resizeTimeout;

const resize = ({force = false}) => {
 const currentHeight = document.body.scrollHeight;
 
 // Проверяем изменения только если это не первый вызов
 if (lastHeight !== null && !force && Math.abs(currentHeight - lastHeight) < 2) {
 return; // Игнорируем незначительные изменения
 }
 
 lastHeight = currentHeight;
 
 const dataUTILS = {
 for: 'BASIC_TEST',
 action: 'resizeIframe',
 selector: `iframe[src*="netlify.app"]`,
 sizes: {
 height: 2 * Math.floor(currentHeight / 2) + 10,
 },
 };

 window?.top?.postMessage(JSON.stringify(dataUTILS), '*');
 }


const resizeObserver = new ResizeObserver(() => {
 resize({});
});
resizeObserver.observe(document.body);
resize({force: true});

setTimeout(() => {
 resize({force: true});
}, 1000);

setTimeout(() => {
 resize({force: true});
}, 2000);

setTimeout(() => {
 resize({force: true});
}, 3000);

setTimeout(() => {
 resize({force: true});
}, 5000);

setTimeout(() => {
 resize({force: true});
}, 7000);

</script>
